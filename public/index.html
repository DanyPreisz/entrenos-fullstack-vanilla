<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrenos</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Gym</p>
      <h1>Entrenos</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Volumen <strong id="volume">0</strong> kg</p><h1>Entrenos</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <form id="set-form" class="card form">
        <input id="day" type="date" required />
        <input id="exercise" placeholder="Ejercicio" maxlength="60" required />
        <input id="series" type="number" min="1" max="20" value="3" placeholder="Series" />
        <input id="reps" type="number" min="1" max="100" value="8" placeholder="Reps" />
        <input id="weight" type="number" min="0" max="500" value="0" placeholder="Kg" />
        <button class="primary" type="submit">Agregar</button>
      </form>
      <p id="form-error" class="error" hidden></p>
      <input id="search" type="search" placeholder="Buscar ejercicio" />
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
